<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informatică și TIC · Clasa a V-a</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E2038;
    --navy2:#173257;
    --cloud:#F5F8FC;
    --paper:#FFFFFF;
    --teal:#22BFAE;
    --teal-dark:#169484;
    --coral:#FF6657;
    --amber:#FFB238;
    --ink:#132038;
    --muted:#5E7290;
    --radius-lg:26px;
    --radius-md:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'Nunito',sans-serif;color:var(--ink);
    background:var(--cloud);-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px;}

  /* HERO */
  .hero{
    background:radial-gradient(circle at 15% 20%, #1B3F6B 0%, var(--navy) 55%, #081428 100%);
    color:#fff;padding:56px 0 60px;position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.35) 0, transparent 60%),
      radial-gradient(2px 2px at 70% 15%, rgba(255,255,255,.25) 0, transparent 60%),
      radial-gradient(1.5px 1.5px at 85% 60%, rgba(255,255,255,.3) 0, transparent 60%);
    pointer-events:none;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
    padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;
    letter-spacing:.03em;margin-bottom:18px;
  }
  .hero h1{font-size:clamp(30px,6.5vw,44px);line-height:1.08;margin:0 0 12px;font-weight:800;}
  .hero h1 em{font-style:normal;color:var(--amber);}
  .hero p{font-size:16px;color:#C9D6E8;max-width:52ch;margin:0;position:relative;}

  /* UNITS */
  .units{padding:44px 0 70px;}
  .unit{
    background:var(--paper);border:1px solid #E4EAF3;border-radius:var(--radius-lg);
    margin-bottom:20px;overflow:hidden;
  }
  .unit-head{
    display:flex;align-items:center;gap:14px;padding:20px 22px;
    background:linear-gradient(155deg,#FFFFFF,#F3F7FC);
  }
  .unit-num{
    width:42px;height:42px;border-radius:14px;flex-shrink:0;
    background:linear-gradient(155deg,var(--teal),var(--teal-dark));
    color:#fff;font-family:'Baloo 2';font-weight:800;font-size:17px;
    display:flex;align-items:center;justify-content:center;
  }
  .unit.empty .unit-num{background:linear-gradient(155deg,#B9C6D9,#93A4BC);}
  .unit-title{font-family:'Baloo 2';font-weight:700;font-size:17px;}
  .unit-title .label{display:block;font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px;}

  .lesson-list{padding:6px 14px 14px;}
  .lesson-row{
    display:flex;align-items:center;gap:12px;
    padding:13px 14px;border-radius:14px;text-decoration:none;color:var(--ink);
    transition:background .15s ease;
  }
  .lesson-row:hover{background:#EEF6F4;}
  .lesson-dot{
    width:26px;height:26px;border-radius:50%;background:var(--cloud);border:2px solid var(--teal);
    color:var(--teal-dark);font-family:'Baloo 2';font-weight:800;font-size:12px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .lesson-name{font-weight:700;font-size:15px;flex:1;}
  .lesson-arrow{color:var(--teal-dark);font-weight:800;}

  .placeholder-row{
    display:flex;align-items:center;gap:12px;padding:16px 20px;margin:6px 14px 14px;
    border:1.5px dashed #D6E0EE;border-radius:14px;color:var(--muted);font-size:13.5px;font-weight:700;
  }
  .placeholder-row .lesson-dot{border-color:#C7D3E3;color:#9FB2CC;}

  footer{padding:20px 0 50px;text-align:center;color:var(--muted);font-size:13px;}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="eyebrow">📘 Manual digital · Clasa a V-a</div>
    <h1>Informatică și <em>TIC</em></h1>
    <p>Toate lecțiile la un loc, organizate pe unități. Alege o lecție de mai jos ca să o deschizi.</p>
  </div>
</header>

<section class="units">
  <div class="wrap" id="unitsWrap"></div>
</section>

<footer>Informatică și TIC · Manual pentru clasa a V-a</footer>

<script>
/* =========================================================
   ADAUGĂ LECȚII NOI AICI.
   Pentru fiecare unitate, în "lessons" adaugi câte un rând:
   { title: "Numele lecției", file: "numele-fisierului.html" }
   Fișierul .html trebuie încărcat în ACELAȘI folder cu index.html.
   ========================================================= */
const unitsData = [
  {
    title: "Utilizarea calculatorului",
    lessons: [
      { title: "Lucrul la calculator", file: "lectia1-lucrul-la-calculator.html" },
      { title: "Calculatorul în prezent", file: "lectia2-calculatorul.html" },
      { title: "Organizarea informatiilor cu calculatorul", file: "lectia3-organizarea.html" },
      { title: "Internetul", file: "lectia4-Internetul.html" }

      
    ]
  },
  {
    title: "Unitatea 2",
    lessons: []
  },
  {
    title: "Unitatea 3",
    lessons: []
  },
  {
    title: "Unitatea 4",
    lessons: []
  }
];

const wrap = document.getElementById('unitsWrap');

unitsData.forEach((unit, uIdx) => {
  const unitEl = document.createElement('div');
  unitEl.className = 'unit' + (unit.lessons.length === 0 ? ' empty' : '');

  const head = document.createElement('div');
  head.className = 'unit-head';
  head.innerHTML = `
    <div class="unit-num">${uIdx + 1}</div>
    <div class="unit-title"><span class="label">Unitatea ${uIdx + 1}</span>${unit.title}</div>
  `;
  unitEl.appendChild(head);

  if (unit.lessons.length > 0) {
    const list = document.createElement('div');
    list.className = 'lesson-list';
    unit.lessons.forEach((lesson, lIdx) => {
      const a = document.createElement('a');
      a.className = 'lesson-row';
      a.href = lesson.file;
      a.innerHTML = `
        <div class="lesson-dot">${lIdx + 1}</div>
        <div class="lesson-name">${lesson.title}</div>
        <div class="lesson-arrow">→</div>
      `;
      list.appendChild(a);
    });
    unitEl.appendChild(list);
  } else {
    const ph = document.createElement('div');
    ph.className = 'placeholder-row';
    ph.innerHTML = `<div class="lesson-dot">·</div> Lecțiile urmează în curând`;
    unitEl.appendChild(ph);
  }

  wrap.appendChild(unitEl);
});
</script>

</body>
</html>
